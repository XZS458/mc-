name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 检查编译环境
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "找不到 csc: $csc" }
          Write-Host "csc: $csc"
          Write-Host ("PowerShell {0}" -f $PSVersionTable.PSVersion)

      - name: 编译
        shell: pwsh
        run: ./build.ps1

      - name: 计算指纹
        id: hash
        shell: pwsh
        run: |
          $file = Get-ChildItem dist\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          Write-Host "$($file.Name)  $($file.Length) 字节"
          Write-Host "SHA-256: $hash"
          "file=$($file.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "**$($file.Name)**  $($file.Length) 字节" >> $env:GITHUB_STEP_SUMMARY
          "``SHA256: $hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PCL原版下载恢复-干净版
          path: dist/*.exe
          if-no-files-found: error

      - name: 附加到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body: |
            由 GitHub Actions 从本仓库源码自动编译。

            | 项目 | 值 |
            |---|---|
            | 文件 | ${{ steps.hash.outputs.file }} |
            | SHA-256 | `${{ steps.hash.outputs.sha256 }}` |

            下载后请核对哈希：`certutil -hashfile <文件> SHA256`
            与这里不一致的，一律不要运行。